<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Shop Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .container {
            max-width: 600px;
            margin-top: 50px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #007bff;
            font-size: 28px;
            font-weight: bold;
        }
        .info-list {
            list-style: none;
            padding: 0;
        }
        .info-list li {
            padding: 10px 0;
            border-bottom: 1px solid #e0e0e0;
            font-size: 18px;
        }
        .info-list li strong {
            color: #333;
        }
        .available {
            color: green;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container text-center">
    <h1 id="shop-name">Loading...</h1>
    <ul class="info-list">
        <li><strong>Shop Number:</strong> <span id="shop-number"></span></li>
        <li><strong>Airport City:</strong> <span id="airport-city"></span></li>
        <li><strong>Tenant:</strong> <span id="tenant"></span></li>
    </ul>
</div>

<script>
    // Get shop name from URL
    const urlParams = new URLSearchParams(window.location.search);
    const shopName = urlParams.get("shop");

    if (shopName) {
        fetch(`/api/resource/Airport Shop/${shopName}`)
            .then(response => response.json())
            .then(data => {
                if (data.data) {
                    document.getElementById("shop-name").textContent = data.data.shop_name;
                    document.getElementById("shop-number").textContent = data.data.shop_number;
                    document.getElementById("airport-city").textContent = data.data.airport_city;
                    let tenantText = data.data.tenant || "Available";
                    document.getElementById("tenant").textContent = tenantText;
                    if (tenantText === "Available") {
                        document.getElementById("tenant").classList.add("available");
                    }
                } else {
                    document.getElementById("shop-name").textContent = "Shop not found!";
                }
            })
            .catch(error => {
                console.error("Error fetching shop data:", error);
                document.getElementById("shop-name").textContent = "Error fetching data!";
            });
    } else {
        document.getElementById("shop-name").textContent = "No shop selected!";
    }
</script>

</body>
</html>
